# One command: `docker compose up --build`
#   app     http://localhost:3000   (dashboard + /v1 API)
#   minio   http://localhost:9001   (console, minioadmin/minioadmin)
# Tests:  `docker compose --profile test run --rm --build test`
#
# The values below are LOCAL DEV DEFAULTS so the stack runs with zero setup.
# Real secrets (FAL_KEY) come from an optional .env file next to this one.

x-app-env: &app-env
  NODE_ENV: production
  APP_URL: http://localhost:3000
  BETTER_AUTH_URL: http://localhost:3000
  DATABASE_URL: postgres://soundverse:soundverse@postgres:5432/soundverse
  API_KEY_PEPPER: dev-only-pepper-change-me-0123456789abcdef
  WEBHOOK_SECRET_ENC_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
  BETTER_AUTH_SECRET: dev-only-better-auth-secret-0123456789abcdef
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: soundverse-audio
  LIVE_PROVIDER: ${LIVE_PROVIDER:-mock}
  FAL_KEY: ${FAL_KEY:-}
  LIVE_PROVIDER_MAX_CALLS: ${LIVE_PROVIDER_MAX_CALLS:-20}
  MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-3000}
  MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0}
  ALLOW_HTTP_WEBHOOKS: ${ALLOW_HTTP_WEBHOOKS:-true}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soundverse
      POSTGRES_PASSWORD: soundverse
      POSTGRES_DB: soundverse
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundverse"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
             mc mb -p local/soundverse-audio && mc anonymous set none local/soundverse-audio"

  migrate:
    build: .
    command: npm run db:migrate
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }

  app:
    build: .
    command: npm start
    environment: *app-env
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: .
    command: npm run worker
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }

  test:
    profiles: [test]
    build: .
    command: npm test
    environment:
      <<: *app-env
      NODE_ENV: test
      DATABASE_URL: postgres://soundverse:soundverse@postgres:5432/soundverse_test
      S3_PUBLIC_ENDPOINT: http://minio:9000
      LIVE_PROVIDER: mock
      FAL_KEY: ""
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

volumes:
  pgdata:
  miniodata:
