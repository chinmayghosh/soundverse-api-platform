# One command: `docker compose up --build`
#   app      http://localhost:3000   (dashboard + /v1 API)
#   storage  http://localhost:9001   (RustFS console, s3admin / s3admin-secret)
# Tests:  `docker compose --profile test run --rm --build test`
#
# The values below are LOCAL DEV DEFAULTS so the stack runs with zero setup.
# Real secrets (FAL_KEY) come from an optional .env file next to this one.

x-app-env: &app-env
  NODE_ENV: production
  APP_URL: http://localhost:3000
  BETTER_AUTH_URL: http://localhost:3000
  DATABASE_URL: postgres://soundverse:soundverse@postgres:5432/soundverse
  API_KEY_PEPPER: dev-only-pepper-change-me-0123456789abcdef
  WEBHOOK_SECRET_ENC_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
  BETTER_AUTH_SECRET: dev-only-better-auth-secret-0123456789abcdef
  S3_ENDPOINT: http://storage:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_ACCESS_KEY: s3admin
  S3_SECRET_KEY: s3admin-secret
  S3_BUCKET: soundverse-audio
  LIVE_PROVIDER: ${LIVE_PROVIDER:-mock}
  FAL_KEY: ${FAL_KEY:-}
  LIVE_PROVIDER_MAX_CALLS: ${LIVE_PROVIDER_MAX_CALLS:-20}
  MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-3000}
  MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0}
  ALLOW_HTTP_WEBHOOKS: ${ALLOW_HTTP_WEBHOOKS:-true}
  # Dev only: lets the demo deliver to a receiver running on your machine.
  # The private-address SSRF check still applies to every other host.
  WEBHOOK_ALLOW_PRIVATE_HOSTS: ${WEBHOOK_ALLOW_PRIVATE_HOSTS:-host.docker.internal}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soundverse
      POSTGRES_PASSWORD: soundverse
      POSTGRES_DB: soundverse
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundverse"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object store. RustFS (Apache-2.0) instead of MinIO, whose
  # Docker images are no longer published. Same S3 API; the bucket is created
  # by the migrate step through the S3 SDK, so any S3 provider works.
  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: s3admin
      RUSTFS_SECRET_KEY: s3admin-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]
    volumes: [s3data:/data]

  migrate:
    build: .
    command: npm run db:migrate
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      storage: { condition: service_started }

  app:
    build: .
    command: npm start
    environment: *app-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: .
    command: npm run worker
    environment: *app-env
    # host.docker.internal on Linux too (built in on Docker Desktop).
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  test:
    profiles: [test]
    build: .
    command: npm test
    environment:
      <<: *app-env
      NODE_ENV: test
      DATABASE_URL: postgres://soundverse:soundverse@postgres:5432/soundverse_test
      S3_PUBLIC_ENDPOINT: http://storage:9000
      LIVE_PROVIDER: mock
      FAL_KEY: ""
      WEBHOOK_ALLOW_PRIVATE_HOSTS: ""
    depends_on:
      postgres: { condition: service_healthy }
      storage: { condition: service_started }

volumes:
  pgdata:
  s3data:
